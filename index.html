<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05080f">
<title>Learning Progress Checklist</title>
<style>
:root{
 --bg:#05080f;--panel:#0a111b;--line:#1b2838;--text:#f3f6fb;--muted:#a9b2bf;
 --orange:#ff9d00;--blue:#25a7ff;--green:#16d66d;--pink:#ff4a91;--cyan:#13d5ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{min-height:100dvh;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:none;text-size-adjust:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.app{
 width:min(100%,430px);min-height:100dvh;margin:0 auto;
 padding:0 8px max(16px,env(safe-area-inset-bottom));
 background:radial-gradient(110% 70% at 50% 0%,rgba(15,37,65,.22),transparent 54%),#05080f;
}
.top-fixed{
 position:sticky;
 top:0;
 z-index:100;
 padding-top:max(12px,env(safe-area-inset-top));
 background:
   linear-gradient(180deg,rgba(5,8,15,1) 0%,rgba(5,8,15,.995) 92%,rgba(5,8,15,.96) 100%);
 box-shadow:0 10px 20px rgba(0,0,0,.24);
}
.viewer-spacer{height:72px}
@media (display-mode: standalone){.viewer-spacer{height:0}}
.header{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto auto;
 align-items:center;
 gap:6px;
 padding:0 4px 9px;
}
.title{
 min-width:0;
 font-size:clamp(11.5px,3.15vw,13.8px);
 line-height:1.05;
 font-weight:850;
 letter-spacing:0;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.count{
 font-size:clamp(9.5px,2.55vw,11.5px);
 color:#d7dde6;
 white-space:nowrap;
}
.reset{
 border:1px solid #2a3646;
 background:#0c111a;
 border-radius:6px;
 padding:5px 7px;
 font-size:clamp(9.5px,2.5vw,11.5px);
 touch-action:manipulation;
}
.overall{display:grid;grid-template-columns:auto minmax(40px,1fr) auto;align-items:center;gap:9px;padding:0 4px 10px}
.overall .label{font-size:clamp(12px,3.4vw,15px);font-weight:800;color:#c8cfda;white-space:nowrap}
.bar,.mini-bar{height:7px;background:#020306;border:1px solid #111a25;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:var(--orange);border-radius:inherit}
.overall .pct{color:var(--orange);font-weight:800;font-size:clamp(14px,4vw,18px);min-width:34px;text-align:right}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.cat{appearance:none;-webkit-appearance:none;width:100%;text-align:left;color:inherit;min-width:0;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:9px 10px 8px;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:8px;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,.005));touch-action:manipulation}
.cat .icon{grid-row:1/3;width:32px;height:32px;display:grid;place-items:center;border-radius:7px;border:1px solid currentColor;font-size:18px;margin-top:1px}
.cat .name{min-width:0;font-size:clamp(11.5px,3.35vw,15px);font-weight:750;line-height:1.08;align-self:end;white-space:nowrap}
.cat .cpct{font-size:clamp(13px,3.7vw,16px);font-weight:800;line-height:1.2}
.cat .mini-bar{grid-column:1/3;height:5px;margin-top:7px}
.foundation{color:var(--green);border-color:#133d2b;background:linear-gradient(135deg,rgba(0,92,54,.18),rgba(0,0,0,.05))}
.core{color:var(--blue);border-color:#183352;background:linear-gradient(135deg,rgba(24,71,125,.18),rgba(0,0,0,.05))}
.fret{color:var(--orange);border-color:#704600;background:linear-gradient(135deg,rgba(117,72,0,.18),rgba(0,0,0,.05))}
.advanced{color:var(--pink);border-color:#4b2237;background:linear-gradient(135deg,rgba(90,17,55,.14),rgba(0,0,0,.05))}.cat.active{box-shadow:0 0 0 1px currentColor inset,0 0 14px rgba(255,157,0,.08)}
.list{display:flex;flex-direction:column;gap:7px}
.section{border:1px solid #172334;border-radius:8px;background:linear-gradient(180deg,#0c1420,#09101a);overflow:hidden}
.section.open{border-color:#8a5700}
.section-header{display:grid;grid-template-columns:32px minmax(0,1fr) auto 15px;gap:7px;align-items:center;text-align:left;padding:8px 9px;cursor:pointer}
.sec-icon{width:31px;height:31px;display:grid;place-items:center;border:1px solid #6e4600;border-radius:7px;color:var(--orange);font-size:17px}
.sec-copy{min-width:0}
.sec-title{font-size:clamp(12.5px,3.65vw,16px);font-weight:800;line-height:1.08;white-space:normal;overflow-wrap:anywhere}
.sec-sub{margin-top:2px;font-size:clamp(9.5px,2.7vw,11.8px);line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.sec-next{margin-top:2px;font-size:clamp(8.8px,2.45vw,10.7px);line-height:1.18;color:#7f8997;overflow-wrap:anywhere}
.sec-pct{font-size:clamp(12.5px,3.6vw,16px);color:var(--orange);font-weight:800}
.chev{font-size:18px;color:#7e8794;transition:.16s transform}
.section.open .chev{transform:rotate(90deg)}
.tasks{display:none;padding:1px 10px 8px}.section.open .tasks{display:block}
.task{display:grid;grid-template-columns:20px 70px minmax(0,1fr);gap:8px;align-items:start;min-height:42px;padding:7px 1px;border-top:1px solid #172332}
.task input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid #8290a3;border-radius:3px;background:#050a10;margin:3px 0 0;position:relative}
.task input:checked{border-color:var(--green);background:#0e6336}
.task input:checked:after{content:"✓";position:absolute;inset:-3px 0 0 2px;color:#fff;font-weight:900;font-size:15px}
.tag{margin-top:1px;display:inline-flex;justify-content:center;align-items:center;min-height:20px;border-radius:4px;border:1px solid currentColor;padding:2px 5px;font-size:clamp(8px,2.2vw,9.8px);line-height:1;font-weight:800;letter-spacing:.35px;white-space:nowrap}
.tag.fretboard{color:var(--cyan)} .tag.hear{color:var(--orange)} .tag.use{color:var(--green)}
.task-text{min-width:0;font-size:clamp(10.5px,2.95vw,13px);line-height:1.27;color:#d1d7e1;overflow-wrap:anywhere}
.task.done .task-text{text-decoration:line-through;color:#7d8793}
.section.harmony{border-color:#432317} .section.modes{border-color:#3c1933} .section.technique{border-color:#402f15} .section.ear{border-color:#41281b}
.section.harmony .sec-icon{color:#ff7b29;border-color:#6b2e0d} .section.modes .sec-icon{color:#d74bff;border-color:#572064} .section.technique .sec-icon{color:#ffad00;border-color:#6c4c00} .section.ear .sec-icon{color:#ff9d00;border-color:#6c4100}
@media(max-width:360px){
 .app{padding-left:6px;padding-right:6px}
 .title{font-size:14px}
 .header{gap:5px}
 .section-header{grid-template-columns:29px minmax(0,1fr) auto 14px;padding-left:7px;padding-right:7px}
 .sec-icon{width:28px;height:28px}
 .task{grid-template-columns:19px 62px minmax(0,1fr);gap:6px}
 .cat{padding-left:8px;padding-right:8px}
 .cat .name{font-size:11px}
}
</style>
</head>
<body>
<main class="app">
  <div class="top-fixed">
  <div class="viewer-spacer"></div>

  <header class="header">
    <div class="title">LEARNING PROGRESS CHECKLIST</div>
    <div class="count" id="countText">0 / 547 checked</div>
    <button class="reset" type="button" id="resetBtn">Reset</button>
  </header>

  <section class="overall">
    <div class="label">OVERALL PROGRESS</div>
    <div class="bar"><div class="fill" id="overallFill"></div></div>
    <div class="pct" id="overallPct">0%</div>
  </section>

  <section class="category-grid">
    <button class="cat foundation" type="button" data-filter="foundation">
      <div class="icon">♧</div><div class="name">Foundation</div><div class="cpct" data-catpct="foundation">0%</div>
      <div class="mini-bar"><div class="fill" data-catfill="foundation" style="background:var(--green)"></div></div>
    </button>
    <button class="cat core" type="button" data-filter="core">
      <div class="icon">▤</div><div class="name">Core Language</div><div class="cpct" data-catpct="core">0%</div>
      <div class="mini-bar"><div class="fill" data-catfill="core" style="background:var(--blue)"></div></div>
    </button>
    <button class="cat fret active" type="button" data-filter="fret">
      <div class="icon">▦</div><div class="name">Full Fretboard</div><div class="cpct" data-catpct="fret">0%</div>
      <div class="mini-bar"><div class="fill" data-catfill="fret" style="background:var(--orange)"></div></div>
    </button>
    <button class="cat advanced" type="button" data-filter="advanced">
      <div class="icon">☆</div><div class="name">Advanced</div><div class="cpct" data-catpct="advanced">0%</div>
      <div class="mini-bar"><div class="fill" data-catfill="advanced" style="background:var(--pink)"></div></div>
    </button>
  </section>
  </div>

  <section class="list" id="sectionList">
    
    <div class="section " data-section="0" data-category="foundation" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">Neck Navigation &amp; CAGED Mastery</div>
          <div class="sec-sub">Connect the five CAGED positions and know what every degree is doing.</div>
          
        </div>
        <div class="sec-pct" data-section-pct="0">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="foundation">
          <input type="checkbox" data-id="0:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every root across the neck without counting frets</span>
        </label>
        <label class="task" data-cat="foundation">
          <input type="checkbox" data-id="0:1">
          <span class="tag use">USE</span>
          <span class="task-text">Move between adjacent CAGED positions without stopping</span>
        </label>
        <label class="task" data-cat="foundation">
          <input type="checkbox" data-id="0:2">
          <span class="tag hear">HEAR</span>
          <span class="task-text">Hear the tonic before changing position</span>
        </label></div>
    </div>

    <div class="section " data-section="1" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">Full Fretboard Navigation</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          <div class="sec-next">Next: Find any note on all six strings</div>
        </div>
        <div class="sec-pct" data-section-pct="1">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="1:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find any note on all six strings</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="1:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Locate every 1, 3 and 5 across the neck</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="1:2">
          <span class="tag use">USE</span>
          <span class="task-text">Connect scale and chord tones between positions</span>
        </label></div>
    </div>

    <div class="section  open" data-section="2" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">C Shape Mastery (Position 1)</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          
        </div>
        <div class="sec-pct" data-section-pct="2">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every scale degree (1–7) while playing — not finger patterns</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find all 7 diatonic triads (I–vii°) inside the shape</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:2">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Play root position, 1st, and 2nd inversion of each triad</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:3">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Play 1–3–5 arpeggio patterns for each triad</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:4">
          <span class="tag hear">HEAR</span>
          <span class="task-text">Voice-lead I–ii–iii–IV–V–vi using the nearest triad each time</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:5">
          <span class="tag use">USE</span>
          <span class="task-text">Target the root, 3rd, or 5th while playing the scale</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="2:6">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Overlay major pentatonic and spot the triad tones inside it</span>
        </label></div>
    </div>

    <div class="section " data-section="3" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">A Shape Mastery (Position 2)</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          <div class="sec-next">Next: Name every scale degree (1–7) while playing — not finger patterns</div>
        </div>
        <div class="sec-pct" data-section-pct="3">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="3:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every scale degree (1–7) while playing — not finger patterns</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="3:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find all 7 diatonic triads inside the shape</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="3:2">
          <span class="tag use">USE</span>
          <span class="task-text">Connect A shape to the nearest neighboring position</span>
        </label></div>
    </div>

    <div class="section " data-section="4" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">G Shape Mastery (Position 3)</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          <div class="sec-next">Next: Name every scale degree (1–7) while playing — not finger patterns</div>
        </div>
        <div class="sec-pct" data-section-pct="4">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="4:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every scale degree (1–7) while playing</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="4:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find all diatonic triads in G shape</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="4:2">
          <span class="tag use">USE</span>
          <span class="task-text">Connect G shape in both neck directions</span>
        </label></div>
    </div>

    <div class="section " data-section="5" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">E Shape Mastery (Position 4)</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          <div class="sec-next">Next: Name every scale degree (1–7) while playing — not finger patterns</div>
        </div>
        <div class="sec-pct" data-section-pct="5">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="5:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every scale degree (1–7) while playing</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="5:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find all diatonic triads in E shape</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="5:2">
          <span class="tag hear">HEAR</span>
          <span class="task-text">Resolve phrases to nearby chord tones</span>
        </label></div>
    </div>

    <div class="section " data-section="6" data-category="fret" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">▦</div>
        <div class="sec-copy">
          <div class="sec-title">D Shape Mastery (Position 5)</div>
          <div class="sec-sub">See roots, degrees and chord tones clearly inside real neck positions.</div>
          <div class="sec-next">Next: Name every scale degree (1–7) while playing — not finger patterns</div>
        </div>
        <div class="sec-pct" data-section-pct="6">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="6:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Name every scale degree (1–7) while playing</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="6:1">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Find all diatonic triads in D shape</span>
        </label>
        <label class="task" data-cat="fret">
          <input type="checkbox" data-id="6:2">
          <span class="tag use">USE</span>
          <span class="task-text">Connect D shape back into C shape</span>
        </label></div>
    </div>

    <div class="section harmony" data-section="7" data-category="core" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">⌘</div>
        <div class="sec-copy">
          <div class="sec-title">Harmony &amp; Arpeggios</div>
          <div class="sec-sub">Build chords, arpeggios, progressions and extensions across the neck.</div>
          
        </div>
        <div class="sec-pct" data-section-pct="7">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="core">
          <input type="checkbox" data-id="7:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Build diatonic triads from any scale degree</span>
        </label>
        <label class="task" data-cat="core">
          <input type="checkbox" data-id="7:1">
          <span class="tag hear">HEAR</span>
          <span class="task-text">Recognize I, IV, V and vi by sound</span>
        </label>
        <label class="task" data-cat="core">
          <input type="checkbox" data-id="7:2">
          <span class="tag use">USE</span>
          <span class="task-text">Voice-lead progressions through nearby inversions</span>
        </label></div>
    </div>

    <div class="section modes" data-section="8" data-category="advanced" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">♫</div>
        <div class="sec-copy">
          <div class="sec-title">Modes &amp; Improvisation</div>
          <div class="sec-sub">Use modal color and chord-tone targeting while moving through positions.</div>
          
        </div>
        <div class="sec-pct" data-section-pct="8">0%</div>
        <div class="chev">›</div>
      </button>
      <div class="tasks">
        <label class="task" data-cat="advanced">
          <input type="checkbox" data-id="8:0">
          <span class="tag fretboard">FRETBOARD</span>
          <span class="task-text">Map modal degrees inside each CAGED position</span>
        </label>
        <label class="task" data-cat="advanced">
          <input type="checkbox" data-id="8:1">
          <span class="tag hear">HEAR</span>
          <span class="task-text">Hear the characteristic note of each mode</span>
        </label>
        <label class="task" data-cat="advanced">
          <input type="checkbox" data-id="8:2">
          <span class="tag use">USE</span>
          <span class="task-text">Target chord tones while improvising</span>
        </label></div>
    </div>

    <div class="section technique" data-section="9" data-category="foundation" >
      <button class="section-header" type="button" aria-expanded="false">
        <div class="sec-icon">◴</div>
        <div class="sec-copy">
          <div class="sec-title">Technique &amp; Rhythm</div>
          <div class="sec-sub">Develop stronger picking, legato, muting and time feel.</div>
          
        </div>

<script>
(function(){
  var key="learning-progress-static-v2";
  var boxes=[].slice.call(document.querySelectorAll('input[type="checkbox"][data-id]'));
  var sections=[].slice.call(document.querySelectorAll(".section[data-section]"));
  var catButtons=[].slice.call(document.querySelectorAll(".cat[data-filter]"));
  var cats=["foundation","core","fret","advanced"];
  var state={checked:{},open:{2:true},filter:"fret"};

  try{
    var saved=JSON.parse(localStorage.getItem(key)||"{}");
    if(saved && typeof saved==="object"){
      state.checked=saved.checked||{};
      state.open=saved.open||{2:true};
      state.filter=saved.filter||"fret";
    }
  }catch(e){}

  function save(){
    try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}
  }

  function setOpen(sec, open){
    var idx=sec.dataset.section;
    sec.classList.toggle("open",!!open);
    var btn=sec.querySelector(".section-header");
    if(btn) btn.setAttribute("aria-expanded",open?"true":"false");
    state.open[idx]=!!open;
  }

  function applyFilter(cat, shouldScroll){
    state.filter=cat;

    catButtons.forEach(function(btn){
      btn.classList.toggle("active",btn.dataset.filter===cat);
    });

    var first=null;
    sections.forEach(function(sec){
      var show=sec.dataset.category===cat;
      sec.style.display=show?"block":"none";
      if(show && !first) first=sec;
    });

    // Always expose one usable section in the selected category.
    var visible=sections.filter(function(s){return s.style.display!=="none"});
    var hasOpen=visible.some(function(s){return s.classList.contains("open")});
    if(!hasOpen && first) setOpen(first,true);

    save();

    if(shouldScroll){
      requestAnimationFrame(function(){
        var list=document.getElementById("sectionList");
        if(list){
          var top=list.getBoundingClientRect().top + window.scrollY - 6;
          window.scrollTo({top:top,behavior:"smooth"});
        }
      });
    }
  }

  sections.forEach(function(sec){
    var idx=sec.dataset.section;
    setOpen(sec, !!state.open[idx]);

    var header=sec.querySelector(".section-header");
    if(header){
      header.addEventListener("click",function(e){
        e.preventDefault();
        setOpen(sec,!sec.classList.contains("open"));
        save();
      });
    }
  });

  boxes.forEach(function(box){
    box.checked=!!state.checked[box.dataset.id];
    box.closest(".task").classList.toggle("done",box.checked);

    box.addEventListener("change",function(){
      state.checked[box.dataset.id]=box.checked;
      box.closest(".task").classList.toggle("done",box.checked);
      save();
      update();
    });
  });

  function update(){
    var done=boxes.filter(function(b){return b.checked}).length;
    var total=547;
    var p=Math.round(done/total*100);

    document.getElementById("countText").textContent=done+" / "+total+" checked";
    document.getElementById("overallPct").textContent=p+"%";
    document.getElementById("overallFill").style.width=p+"%";

    cats.forEach(function(cat){
      var cb=boxes.filter(function(b){
        return b.closest(".task").dataset.cat===cat;
      });
      var cd=cb.filter(function(b){return b.checked}).length;
      var cp=cb.length?Math.round(cd/cb.length*100):0;
      var pct=document.querySelector('[data-catpct="'+cat+'"]');
      var fill=document.querySelector('[data-catfill="'+cat+'"]');
      if(pct)pct.textContent=cp+"%";
      if(fill)fill.style.width=cp+"%";
    });

    sections.forEach(function(sec){
      var cb=[].slice.call(sec.querySelectorAll('input[type="checkbox"]'));
      var cd=cb.filter(function(b){return b.checked}).length;
      var sp=cb.length?Math.round(cd/cb.length*100):0;
      var el=sec.querySelector("[data-section-pct]");
      if(el)el.textContent=sp+"%";
    });
  }

  catButtons.forEach(function(btn){
    btn.addEventListener("click",function(){
      applyFilter(btn.dataset.filter,true);
    });
  });

  document.getElementById("resetBtn").addEventListener("click",function(){
    state.checked={};
    boxes.forEach(function(b){
      b.checked=false;
      b.closest(".task").classList.remove("done");
    });
    save();
    update();
  });

  // Prevent double-tap/pinch zoom on iPhone while keeping one-finger vertical scrolling.
  var lastTouchEnd=0;
  document.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTouchEnd<=300) e.preventDefault();
    lastTouchEnd=now;
  },{passive:false});

  document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});
  document.addEventListener("gesturechange",function(e){e.preventDefault()},{passive:false});
  document.addEventListener("gestureend",function(e){e.preventDefault()},{passive:false});
  document.addEventListener("touchmove",function(e){
    if(e.touches && e.touches.length>1) e.preventDefault();
  },{passive:false});

  update();
  applyFilter(state.filter,false);
})();
</script>
</body>
</html>
